# Despliegue del backend en Render.
#
# Se eligio Render y no Vercel porque el backend necesita un proceso que quede
# corriendo: el scheduler de dosis no tomadas usa setInterval y en serverless
# no sobrevive entre requests.
#
# Las variables marcadas sync: false NO van en este archivo: se cargan a mano
# en el panel de Render, porque son secretos.

services:
  - type: web
    name: voitos-backend
    runtime: node
    plan: free
    region: oregon
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: npm start
    # Sin healthCheckPath a proposito. El unico endpoint publico que responde
    # rapido es /api/sensor/pendiente, y consulta Supabase: usarlo como health
    # check haria que Render golpee la base cada pocos minutos, para siempre.
    # Sin health check, Render da el servicio por vivo cuando toma el puerto.
    #
    # OJO con el plan free: el servicio se duerme a los 15 minutos sin trafico.
    # Mientras duerme, el scheduler de dosis no tomadas NO corre, asi que ese
    # mail puede no salir. Para la demo alcanza; para uso real hace falta el
    # plan pago o un cron externo que lo despierte.
    envVars:
      # Node 22 o mas, no menos: @supabase/supabase-js crea un RealtimeClient
      # al construir el cliente, y ese busca el WebSocket nativo. En Node 20 no
      # existe, asi que el proceso muere al arrancar con
      # "Node.js detected but native WebSocket not found".
      - key: NODE_VERSION
        value: "22"
      - key: SUPABASE_URL
        value: https://pshejdspqqhuhyjbzslx.supabase.co
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Envio de mails por API HTTPS. Render bloquea el SMTP saliente en el
      # plan free, asi que sin esto NINGUN mail sale: ni el de verificacion, ni
      # el de dispensacion, ni el de dosis no tomada. La clave se saca de
      # resend.com y se carga a mano en el panel.
      # Envio de mails por API HTTPS. Render bloquea el SMTP saliente, asi que
      # sin uno de estos NINGUN mail sale.
      #
      # Brevo es el que se usa: deja mandar a cualquier destinatario con solo
      # verificar una casilla como remitente, sin dominio propio. Resend en su
      # plan gratuito sin dominio solo entrega a la casilla del titular, y este
      # proyecto le manda mails a cada cuidador que se registra.
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_FROM_EMAIL
        value: voitos.pastillero@gmail.com
      # Alternativa, si alguna vez se verifica un dominio propio
      - key: RESEND_API_KEY
        sync: false
      # Las MAIL_* quedan para desarrollo local, donde el SMTP si funciona.
      - key: MAIL_HOST
        value: smtp.gmail.com
      - key: MAIL_PORT
        value: "587"
      - key: MAIL_USER
        sync: false
      - key: MAIL_PASS
        sync: false
      # Enlaces de los mails: APP_URL es el frontend, API_URL es este servicio
      - key: APP_URL
        value: https://voitos.vercel.app
      - key: API_URL
        value: https://voitos-backend.onrender.com
